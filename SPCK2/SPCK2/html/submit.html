<div class="container py-5">

    <div class="submit-box mx-auto">

        <div class="text-center mb-4">

            <h1 class="submit-title">
                Gửi tin tức mới
            </h1>

            <p class="text-muted">
                Chia sẻ thông tin của bạn với Daily News
            </p>

        </div>


        <div class="alert alert-info">

            <strong>Người gửi:</strong>

            <span id="submitAuthor">
                Đang kiểm tra tài khoản...
            </span>

        </div>


        <form id="submitPostForm">


            <!-- TIÊU ĐỀ -->

            <div class="mb-3">

                <label
                    for="postTitle"
                    class="form-label fw-bold"
                >
                    Tiêu đề
                </label>

                <input
                    type="text"
                    id="postTitle"
                    class="form-control"
                    placeholder="Nhập tiêu đề bài viết"
                    maxlength="200"
                    required
                >

                <div
                    class="form-text"
                    id="titleWordCount"
                >
                    0 từ
                </div>

            </div>


            <!-- DANH MỤC -->

            <div class="mb-3">

                <label
                    for="postCategory"
                    class="form-label fw-bold"
                >
                    Danh mục
                </label>

                <select
                    id="postCategory"
                    class="form-select"
                    required
                >

                    <option value="">
                        -- Chọn danh mục --
                    </option>

                    <option value="Thời sự">
                        Thời sự
                    </option>

                    <option value="Giải trí">
                        Giải trí
                    </option>

                    <option value="Thế giới">
                        Thế giới
                    </option>

                    <option value="Thể thao">
                        Thể thao
                    </option>

                    <option value="Công nghệ">
                        Công nghệ
                    </option>

                    <option value="Đời sống">
                        Đời sống
                    </option>

                </select>

            </div>


            <!-- ẢNH -->

            <div class="mb-3">

                <label
                    for="postImage"
                    class="form-label fw-bold"
                >
                    Link ảnh
                </label>

                <input
                    type="url"
                    id="postImage"
                    class="form-control"
                    placeholder="https://..."
                >

                <div class="form-text">
                    Có thể bỏ trống nếu không có ảnh.
                </div>

            </div>


            <!-- NỘI DUNG -->

            <div class="mb-3">

                <label
                    for="postContent"
                    class="form-label fw-bold"
                >
                    Nội dung
                </label>

                <textarea
                    id="postContent"
                    class="form-control"
                    rows="10"
                    placeholder="Nhập nội dung bài viết..."
                    maxlength="10000"
                    required
                ></textarea>

                <div
                    class="form-text"
                    id="contentWordCount"
                >
                    0 từ
                </div>

            </div>


            <!-- ẨN DANH -->

            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="postAnonymous"
                >

                <label
                    class="form-check-label"
                    for="postAnonymous"
                >
                    Đăng bài ẩn danh
                </label>

            </div>


            <!-- NÚT -->

            <button
                type="submit"
                class="btn btn-primary w-100 py-2"
            >
                Đăng bài
            </button>


            <div
                id="submitMessage"
                class="mt-3"
            ></div>

        </form>

    </div>

</div>
