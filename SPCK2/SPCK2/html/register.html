<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Đăng ký - Tin Tức</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/account.css">

</head>


<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container">
        <a class="navbar-brand fw-bold"
        href="index.html"
        onclick="goHomeWithAccountCheck(event)">
            Tin Tức
        </a>


        <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <div
            class="collapse navbar-collapse"
            id="navMenu"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                        href="index.html"
                        onclick="goHomeWithAccountCheck(event)">
                        Trang chủ
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="login.html"
                    >
                        Đăng nhập
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<div class="auth-container">

    <div class="auth-box">

        <h2 class="auth-title">
            Tạo tài khoản
        </h2>


        <p class="auth-description">
            Đăng ký tài khoản để sử dụng website
        </p>


        <form id="registerForm">

            <div class="mb-3">

                <label class="form-label">
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="registerName"
                    class="form-control"
                    placeholder="Nhập họ tên"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    class="form-control"
                    placeholder="example@gmail.com"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Mật khẩu
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('registerPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Xác nhận mật khẩu
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerConfirm"
                        class="form-control"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('registerConfirm', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Đăng ký
            </button>

        </form>


        <p
            id="registerMessage"
            class="message"
        ></p>


        <div class="auth-bottom">

            Đã có tài khoản?

            <a href="login.html">
                Đăng nhập
            </a>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<script src="../js/script.js"></script>

</body>
</html>
